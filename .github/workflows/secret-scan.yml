name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout v4.2.2; no third-party services or secrets.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan worktree, history and commit messages
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/security/scan_git_secrets.py
